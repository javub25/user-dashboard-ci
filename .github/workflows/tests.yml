name: User Dashboard Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read
    
jobs:
  run-tests:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dev server (npm run dev)
        run: |
          npm run dev > /tmp/dev.log 2>&1 &
          echo $! > /tmp/dev.pid

          TIMEOUT=60
          INTERVAL=2
          ELAPSED=0
          URL=http://localhost:5173

          until curl --silent --fail --output /dev/null "$URL"; do
            if [ "$ELAPSED" -ge "$TIMEOUT" ]; then
              echo "::error::Dev server did not start within ${TIMEOUT}s"
              echo "----- /tmp/dev.log -----"
              cat /tmp/dev.log
              exit 1
            fi
            sleep "$INTERVAL"
            ELAPSED=$((ELAPSED + INTERVAL))
          done

          echo "Server is ready!"

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Typecheck
        run: npm run typecheck
